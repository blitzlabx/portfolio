<style>
/* ============ TOKENS ============ */
:root{
  --bg:#0B0B0C; --bg2:#111113; --line:#232327; --line2:#333338;
  --txt:#F4F3EF; --mut:#A8A8A0; --dim:#6F6F69;
  --volt:#F5E003; --ink:#0B0B0C;
  --fd:'Space Grotesk',sans-serif; --fm:'JetBrains Mono',monospace;
  --e:cubic-bezier(.22,1,.36,1);
  --pad:clamp(20px,5vw,72px);
  color-scheme:dark;
}
/* ============ BASE ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
html,body{overflow-x:clip}
body{background:var(--bg);color:var(--txt);font:400 16px/1.65 var(--fd);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
::selection{background:var(--volt);color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select{font:inherit}
img{display:block;max-width:100%}
:focus-visible{outline:2px solid var(--volt);outline-offset:3px}
main:focus{outline:none}
html.lock,html.lock body{overflow:hidden}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#26262B;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--volt)}
.mono{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:fixed;top:-60px;left:16px;z-index:300;background:var(--volt);color:var(--ink);padding:10px 16px;font-family:var(--fm);font-size:12px;transition:top .2s}
.skip:focus{top:12px}
.wrap{max-width:1240px;margin:0 auto;padding-left:var(--pad);padding-right:var(--pad)}
.dotp{width:6px;height:6px;background:var(--volt);border-radius:50%;display:inline-block;animation:pl 1.6s infinite}
.dotp.off{background:#D05237;animation:none}
@keyframes pl{0%,100%{opacity:1}50%{opacity:.2}}

/* ============ LOADER ============ */
#ld{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;transition:opacity .45s,visibility .45s}
#ld.off{opacity:0;visibility:hidden}
.ldbox{display:flex;flex-direction:column;align-items:center;gap:18px}
.ldbox svg{width:26px;height:38px;fill:var(--volt);animation:ldf 1.5s infinite}
@keyframes ldf{0%,6%,9%,100%{opacity:1}7%{opacity:.1}8%{opacity:.7}}
.ldtxt{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase}
.ldbar{width:140px;height:2px;background:var(--line);overflow:hidden;position:relative}
.ldbar::after{content:"";position:absolute;top:0;left:0;width:36%;height:100%;background:var(--volt);animation:ldr 1.1s var(--e) infinite}
@keyframes ldr{0%{transform:translateX(-110%)}100%{transform:translateX(300%)}}

/* ============ HEADER ============ */
.hdr{position:fixed;top:0;left:0;right:0;z-index:100;height:62px;background:rgba(11,11,12,.8);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.hdr .wrap{height:100%;display:flex;align-items:center;gap:26px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.03em;display:inline-flex;align-items:baseline}
.lbolt svg{width:.55em;height:.78em;fill:var(--volt);display:inline-block;transform:translateY(.03em);margin:0 .015em}
.nav{margin-left:auto;display:flex;gap:26px}
.nav a{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);position:relative;padding:6px 0;transition:color .2s}
.nav a::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:100%;background:var(--volt);transform:scaleX(0);transform-origin:left;transition:transform .35s var(--e)}
.nav a:hover{color:var(--txt)}
.nav a:hover::after,.nav a.on::after{transform:scaleX(1)}
.nav a.on{color:var(--txt)}
/* volt gauge */
.gauge{display:flex;align-items:center;gap:9px;color:var(--dim);font-family:var(--fm);font-size:10px;letter-spacing:.1em}
.gauge .gb{width:10px;height:14px;fill:var(--dim);transition:fill .3s}
.gauge.full .gb{fill:var(--volt)}
.ticks{display:flex;gap:2px}
.ticks i{width:3px;height:10px;background:var(--line2);transition:background .25s}
.ticks i.f{background:var(--volt)}
.gauge.full .gv{color:var(--volt)}
.gv{min-width:36px;text-align:right}
.burger{display:none;margin-left:auto;width:40px;height:40px;position:relative}
.burger span{position:absolute;left:9px;right:9px;height:2px;background:var(--txt);transition:transform .3s var(--e),top .3s var(--e)}
.burger span:nth-child(1){top:15px}
.burger span:nth-child(2){top:23px}
.burger[aria-expanded="true"] span:nth-child(1){top:19px;transform:rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){top:19px;transform:rotate(-45deg)}

/* ============ MOBILE MENU ============ */
#menu{position:fixed;inset:0;z-index:90;background:var(--bg);transform:translateY(-102%);transition:transform .5s var(--e);display:flex;flex-direction:column;justify-content:center;padding:80px var(--pad) 40px}
#menu.open{transform:none}
.ml a{display:flex;align-items:baseline;gap:18px;font-size:clamp(36px,9vw,60px);font-weight:700;letter-spacing:-.03em;padding:16px 0;border-bottom:1px solid var(--line);opacity:0;transform:translateY(18px);transition:opacity .5s var(--e),transform .5s var(--e)}
.ml a .n{font-family:var(--fm);font-size:11px;color:var(--volt);letter-spacing:.14em}
.ml a:active,.ml a:hover{color:var(--volt)}
#menu.open .ml a{opacity:1;transform:none;transition-delay:calc(.1s + var(--i)*.06s)}
.msoc{display:flex;gap:12px;margin-top:36px;opacity:0;transition:opacity .5s .4s}
#menu.open .msoc{opacity:1}
.msoc a{width:46px;height:46px;border:1px solid var(--line2);display:grid;place-items:center}
.msoc svg{width:18px;height:18px;fill:var(--mut)}
.msoc a:hover svg{fill:var(--volt)}

/* ============ REVEAL ============ */
[data-reveal]{opacity:0;transform:translateY(16px);transition:opacity .65s var(--e),transform .65s var(--e);transition-delay:calc(var(--i,0)*70ms)}
[data-reveal].in{opacity:1;transform:none}

/* ============ HERO ============ */
.hero{position:relative;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding-top:130px;background-image:url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="28" height="28"><circle cx="1.2" cy="1.2" r="1.2" fill="%23FFFFFF" fill-opacity=".045"/></svg>')}
#arc{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .wrap{position:relative;width:100%}
.live-row{display:flex;align-items:center;gap:10px;font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);flex-wrap:wrap}
.live-row b{color:var(--mut);font-weight:400}
.hw{font-weight:700;font-size:clamp(64px,17.5vw,206px);line-height:.95;letter-spacing:-.045em;margin:18px 0 26px}
.hw .lm{display:inline-block;overflow:hidden;vertical-align:bottom}
.hw .l{display:inline-block;transform:translateY(114%);transition:transform .8s var(--e)}
.hw.go .l{transform:none}
.hw .lm:nth-child(1) .l{transition-delay:.05s}
.hw .lm:nth-child(2) .l{transition-delay:.12s}
.hw .lm:nth-child(3) .l{transition-delay:.19s}
.hw .lm:nth-child(4) .l{transition-delay:.26s}
.hw .lm:nth-child(5) .l{transition-delay:.33s}
.lbolt svg{animation:nflick 7.5s infinite .9s}
@keyframes nflick{0%,90%,94.5%,100%{opacity:1}91%{opacity:.08}92.5%{opacity:.85}94%{opacity:.2}}
.tagchip{display:inline-flex;align-items:center;gap:9px;border:1px solid var(--line2);padding:8px 14px;font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}
.tagchip svg{width:10px;height:14px;fill:var(--volt)}
.hsub{max-width:54ch;color:var(--mut);font-size:clamp(15px,1.7vw,19px);margin:26px 0 34px}
.hsub a{color:var(--txt);border-bottom:1px solid var(--line2);transition:border-color .2s,color .2s}
.hsub a:hover{color:var(--volt);border-color:var(--volt)}
.hcta{display:flex;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:10px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:15px 24px;border:1px solid var(--line2);transition:border-color .2s,color .2s,background .2s,filter .2s}
.btn svg{width:13px;height:13px;transition:transform .25s var(--e)}
.btn:hover{border-color:var(--volt);color:var(--volt)}
.btn:hover svg{transform:translate(2px,-2px)}
.btn.pri{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.btn.pri:hover{color:var(--ink);filter:brightness(1.07)}
.hstats{display:flex;border-top:1px solid var(--line);margin-top:clamp(44px,6vw,76px)}
.hs{flex:1;padding:20px 24px 26px 0;border-right:1px solid var(--line)}
.hs:last-child{border-right:0}
.hs .k{font-family:var(--fm);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:8px}
.hs .v{font-size:clamp(20px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1}
@media(max-width:560px){.hs{padding:16px 12px 20px 0}.hs .v{font-size:17px}}

/* ============ MARQUEE ============ */
.marq{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;padding:13px 0}
.mtrack{display:flex;width:max-content;animation:mar 30s linear infinite}
.marq:hover .mtrack{animation-play-state:paused}
.mhalf{display:flex;gap:0;padding-right:0}
.mi{display:inline-flex;align-items:center;gap:26px;padding-right:26px;font-family:var(--fm);font-size:10px;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.mi svg{width:9px;height:13px;fill:var(--volt)}
@keyframes mar{to{transform:translateX(-50%)}}

/* ============ SECTIONS ============ */
.sec{padding:clamp(72px,9vw,128px) 0 0}
.shead{display:flex;align-items:baseline;gap:18px;border-top:1px solid var(--line);padding-top:20px;margin-bottom:clamp(34px,4.5vw,58px);flex-wrap:wrap}
.shead .n{font-family:var(--fm);font-size:11px;letter-spacing:.14em;color:var(--volt)}
.shead h2{font-size:clamp(30px,4.6vw,54px);font-weight:700;letter-spacing:-.03em;line-height:1}
.shead .src{margin-left:auto;font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:right}
.dstat{font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);padding:36px 0;display:flex;align-items:center;gap:10px}
.derr{border:1px dashed var(--line2);padding:26px;margin:10px 0}
.derr p{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:16px}
.erow{display:flex;gap:10px;flex-wrap:wrap}
.ext{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line2);padding:8px 12px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);background:var(--bg);transition:border-color .2s,color .2s;cursor:pointer}
.ext:hover{border-color:var(--volt);color:var(--volt)}
.ext svg{width:11px;height:11px}

/* about teaser */
.agrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(28px,5vw,72px);align-items:start}
.agrid .lead{font-size:clamp(19px,2.2vw,25px);line-height:1.5;color:var(--txt);letter-spacing:-.01em}
.agrid p+p{margin-top:20px;color:var(--mut)}
.tlink{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--volt);margin-top:28px}
.tlink svg{width:13px;height:13px;transition:transform .25s var(--e)}
.tlink:hover svg{transform:translateX(4px)}
.fig{position:relative;border:1px solid var(--line);padding:14px}
.fig::before{content:"";position:absolute;top:-1px;left:-1px;width:16px;height:16px;border-top:2px solid var(--volt);border-left:2px solid var(--volt)}
.fig::after{content:"";position:absolute;bottom:-1px;right:-1px;width:16px;height:16px;border-bottom:2px solid var(--volt);border-right:2px solid var(--volt)}
.fig img{width:100%;filter:grayscale(1) contrast(1.05);transition:filter .4s}
.fig:hover img{filter:none}
.fig figcaption{display:flex;justify-content:space-between;font-family:var(--fm);font-size:9px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-top:12px}
.facts{margin-top:18px}
.facts div{display:flex;justify-content:space-between;gap:16px;border-bottom:1px solid var(--line);padding:10px 2px;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.facts dt{color:var(--dim)}
.facts dd{color:var(--mut);text-align:right}
@media(max-width:860px){.agrid{grid-template-columns:1fr}.afig{max-width:340px}}

/* project rows */
.plist{border-top:1px solid var(--line)}
.proj{position:relative;display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:6px 24px;padding:26px 6px 26px 0;border-bottom:1px solid var(--line);transition:background .3s}
.proj:hover{background:rgba(245,224,3,.035)}
.proj .trace{position:absolute;top:-1px;left:0;height:1px;width:100%;background:var(--volt);transform:scaleX(0);transform-origin:left;transition:transform .55s var(--e)}
.proj:hover .trace{transform:scaleX(1)}
.pi{font-family:var(--fm);font-size:11px;color:var(--dim);padding-top:8px;letter-spacing:.1em;transition:color .25s}
.proj:hover .pi{color:var(--volt)}
.pm h3{font-size:clamp(20px,2.6vw,30px);font-weight:600;letter-spacing:-.02em;line-height:1.15;transition:color .25s;overflow-wrap:anywhere}
.proj:hover .pm h3{color:var(--volt)}
.plist.feat .proj:first-child .pm h3{font-size:clamp(28px,4.4vw,46px)}
.pm p{color:var(--mut);max-width:66ch;margin-top:8px;font-size:15px;overflow-wrap:anywhere}
.stretch{position:absolute;inset:0;z-index:1}
.stretch:focus-visible{outline-offset:-2px}
.pmeta{display:flex;flex-wrap:wrap;gap:12px 16px;align-items:center;justify-content:flex-end;font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);position:relative;z-index:2;padding-top:6px}
.pmeta .lg{display:inline-flex;gap:7px;align-items:center;color:var(--mut)}
.pmeta .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pmeta svg{width:11px;height:11px}
.pmeta .st{display:inline-flex;gap:6px;align-items:center}
@media(max-width:720px){
  .proj{grid-template-columns:38px minmax(0,1fr)}
  .pmeta{grid-column:2;justify-content:flex-start}
}

/* tech / language load */
.lrow{display:grid;grid-template-columns:minmax(130px,210px) 1fr auto;align-items:center;gap:10px 26px;width:100%;text-align:left;padding:15px 6px;border-bottom:1px solid var(--line);transition:background .25s;cursor:pointer}
.lrow:hover{background:rgba(245,224,3,.035)}
.lrow .ln{font-family:var(--fm);font-size:13px;letter-spacing:.06em;transition:color .2s}
.lrow:hover .ln{color:var(--volt)}
.lrow .lc{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;text-align:right;white-space:nowrap}
.met{display:flex;gap:3px;align-items:center;min-width:0;overflow:hidden}
.met i{width:3px;height:16px;background:var(--line);flex:none}
[data-reveal] .met i.f{background:var(--line)}
[data-reveal].in .met i.f{background:var(--volt);transition:background .4s;transition-delay:calc(var(--s)*20ms)}
.lnote{font-family:var(--fm);font-size:10px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;margin-top:22px}

/* github section */
.ggrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(28px,4vw,60px);align-items:start}
.gcard{border:1px solid var(--line);padding:clamp(20px,3vw,30px)}
.gcard .top{display:flex;gap:18px;align-items:center}
.gcard img{width:76px;height:76px;filter:grayscale(1);transition:filter .4s}
.gcard:hover img{filter:none}
.gcard .gh-name{font-size:22px;font-weight:600;letter-spacing:-.02em}
.gcard .gh-handle{font-family:var(--fm);font-size:11px;color:var(--volt);letter-spacing:.1em}
.gcard .bio{color:var(--mut);font-size:14px;margin-top:16px;min-height:0}
.gspec{margin-top:20px}
.gspec div{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.gspec dt{color:var(--dim)}.gspec dd{color:var(--txt)}
.gcard .btn{margin-top:20px;width:100%;justify-content:center}
.rlist .rk{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding-bottom:14px;display:block}
.ritem{display:flex;align-items:baseline;gap:16px;padding:15px 4px;border-top:1px solid var(--line);transition:background .25s}
.ritem:hover{background:rgba(245,224,3,.035)}
.ritem .rn{font-size:17px;font-weight:500;letter-spacing:-.01em;transition:color .2s;overflow-wrap:anywhere}
.ritem:hover .rn{color:var(--volt)}
.ritem .rt{margin-left:auto;font-family:var(--fm);font-size:10px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.ritem .lg{display:inline-flex;align-items:center;gap:7px;font-family:var(--fm);font-size:10px;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.ritem .lg i{width:7px;height:7px;border-radius:50%}
@media(max-width:860px){.ggrid{grid-template-columns:1fr}}

/* blitzcore */
.bc{position:relative;border:1px solid var(--line);padding:clamp(28px,5vw,60px);overflow:hidden}
.bc::before{content:"";position:absolute;top:-1px;left:-1px;width:18px;height:18px;border-top:2px solid var(--volt);border-left:2px solid var(--volt)}
.bc::after{content:"";position:absolute;bottom:-1px;right:-1px;width:18px;height:18px;border-bottom:2px solid var(--volt);border-right:2px solid var(--volt)}
.bc .k{font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:var(--volt);text-transform:uppercase}
.bc h3{font-size:clamp(34px,6vw,74px);font-weight:700;letter-spacing:-.03em;line-height:1;margin:14px 0 18px;position:relative}
.bcbolt{position:absolute;right:-30px;top:50%;height:130%;transform:translateY(-50%);pointer-events:none}
.bcbolt svg{height:100%;width:auto;fill:none;stroke:var(--line);stroke-width:.6}
.bc p{max-width:62ch;color:var(--mut);position:relative}
.bcrepos{margin-top:26px;position:relative}
.bcrepos .rk{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;display:block;margin-bottom:6px}
.bcrepos a{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:12px;letter-spacing:.08em;border:1px solid var(--line2);padding:9px 13px;margin:6px 8px 0 0;transition:border-color .2s,color .2s;text-transform:uppercase}
.bcrepos a:hover{border-color:var(--volt);color:var(--volt)}
.bcrepos svg{width:11px;height:11px}

/* contact strip (home) */
.cstrip{display:flex;align-items:center;justify-content:space-between;gap:28px;flex-wrap:wrap}
.cstrip .cl h2{font-size:clamp(28px,4vw,46px);font-weight:700;letter-spacing:-.03em;line-height:1.05}
.cstrip .cl p{color:var(--mut);margin-top:12px;max-width:44ch}
.cbtns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.ibtn{width:46px;height:46px;border:1px solid var(--line2);display:grid;place-items:center;transition:border-color .2s,transform .2s,color .2s;color:var(--mut)}
.ibtn svg{width:17px;height:17px;fill:currentColor}
.ibtn:hover{border-color:var(--volt);color:var(--volt);transform:translateY(-3px)}

/* ============ INNER PAGE HEADS ============ */
.phead{padding:150px 0 0}
.crumb{display:inline-flex;align-items:center;gap:8px;font-family:var(--fm);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);transition:color .2s}
.crumb:hover{color:var(--volt)}
.crumb svg{width:12px;height:12px}
.phead h1{font-size:clamp(42px,7.5vw,96px);font-weight:700;letter-spacing:-.04em;line-height:.98;margin:22px 0 18px;overflow-wrap:anywhere}
.phead .sub{color:var(--mut);max-width:60ch}
.phead .sub a{color:var(--txt);border-bottom:1px solid var(--line2)}
.phead .sub a:hover{color:var(--volt);border-color:var(--volt)}

/* projects page */
.fbar{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:38px 0 8px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--line2);padding:9px 13px;color:var(--mut);transition:all .2s;cursor:pointer}
.chip:hover{border-color:var(--volt);color:var(--volt)}
.chip.on{background:var(--volt);border-color:var(--volt);color:var(--ink)}
.fsort{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.fsort input{background:var(--bg);border:1px solid var(--line2);color:var(--txt);font-family:var(--fm);font-size:11px;letter-spacing:.08em;padding:10px 12px;width:170px}
.fsort input::placeholder{color:var(--dim)}
.fsort select{background:var(--bg);border:1px solid var(--line2);color:var(--mut);font-family:var(--fm);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;cursor:pointer}
.cnt{font-family:var(--fm);font-size:10px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;padding:14px 0}
.empty{font-family:var(--fm);font-size:11px;letter-spacing:.12em;color:var(--dim);text-transform:uppercase;padding:44px 0;border-bottom:1px solid var(--line)}

/* detail page */
.dmeta{display:flex;flex-wrap:wrap;gap:12px 22px;font-family:var(--fm);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);align-items:center}
.dmeta .lg{display:inline-flex;align-items:center;gap:7px;color:var(--mut)}
.dmeta .lg i{width:8px;height:8px;border-radius:50%}
.dmeta svg{width:11px;height:11px}
.dcta{display:flex;gap:12px;flex-wrap:wrap;margin:30px 0 10px}
.dbody{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(30px,5vw,70px);margin-top:clamp(40px,5vw,64px);align-items:start}
.dbody h4{font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;border-top:1px solid var(--line);padding-top:16px;margin-bottom:16px}
.dbody .ov{color:var(--mut);font-size:16px;max-width:60ch}
.dbody .ov+.ov{margin-top:14px}
.hl{list-style:none}
.hl li{padding:10px 0 10px 22px;border-bottom:1px solid var(--line);color:var(--mut);font-size:15px;position:relative}
.hl li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:2px;background:var(--volt)}
.spec div{display:flex;gap:20px;padding:11px 0;border-bottom:1px solid var(--line);font-family:var(--fm);font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.spec .sk{width:120px;flex:none;color:var(--dim)}
.spec .sv{color:var(--txt)}
.topi{display:flex;flex-wrap:wrap;gap:8px}
.topi span{border:1px solid var(--line2);padding:5px 10px;font-family:var(--fm);font-size:9px;letter-spacing:.12em;color:var(--mut);text-transform:uppercase}
.dshot{border:1px solid var(--line);padding:10px;margin-bottom:26px}
.dshot img{width:100%}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);margin-top:clamp(50px,7vw,90px)}
.pn a{background:var(--bg);padding:22px;transition:background .25s;min-width:0}
.pn a:hover{background:var(--bg2)}
.pn .k{display:block;font-family:var(--fm);font-size:9px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;margin-bottom:8px}
.pn strong{font-size:clamp(15px,2vw,20px);font-weight:600;letter-spacing:-.01em;display:block;overflow-wrap:anywhere}
.pn a:last-child{text-align:right}
.pn a:hover strong{color:var(--volt)}
@media(max-width:860px){.dbody{grid-template-columns:1fr}}

/* contact page rows */
.clist{border-top:1px solid var(--line);margin-top:clamp(36px,5vw,60px)}
.crow{display:grid;grid-template-columns:52px minmax(0,1fr) auto auto 30px;align-items:center;gap:20px;padding:24px 12px;border-bottom:1px solid var(--line);transition:background .22s;position:relative}
.crow svg.pi-ic{width:20px;height:20px;fill:var(--mut);transition:fill .22s}
.crow .cn{font-size:clamp(19px,2.6vw,27px);font-weight:600;letter-spacing:-.02em}
.crow .ch{font-family:var(--fm);font-size:11px;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;white-space:nowrap}
.crow .cd{font-family:var(--fm);font-size:9px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase;white-space:nowrap}
.crow .ar{justify-self:end}
.crow .ar svg{width:16px;height:16px;transition:transform .3s var(--e)}
.crow:hover{background:var(--volt)}
.crow:hover .cn,.crow:hover .ch,.crow:hover .cd{color:var(--ink)}
.crow:hover svg.pi-ic{fill:var(--ink)}
.crow:hover .ar svg{transform:translate(3px,-3px)}
.best{border:1px solid var(--line2);padding:3px 8px;font-family:var(--fm);font-size:8px;letter-spacing:.16em;color:var(--dim);text-transform:uppercase;transition:border-color .2s,color .2s;margin-left:12px;vertical-align:middle}
.crow:hover .best{border-color:var(--ink);color:var(--ink)}
@media(max-width:640px){.crow{grid-template-columns:40px minmax(0,1fr) 26px;padding:20px 8px}.crow .cd,.crow .ch{display:none}.crow .ch.m{display:block}}

/* about page */
.ab-grid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,4fr);gap:clamp(30px,5vw,72px);align-items:start}
.ab-grid p{color:var(--mut);font-size:clamp(16px,1.8vw,18px)}
.ab-grid p.lead{color:var(--txt);font-size:clamp(20px,2.4vw,26px);line-height:1.5;letter-spacing:-.01em}
.ab-grid p+p{margin-top:22px}
.pstack{margin-top:clamp(46px,6vw,80px)}
.pstack h4{font-family:var(--fm);font-size:10px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;border-top:1px solid var(--line);padding-top:16px;margin-bottom:20px}
.prin{counter-reset:pr}
.prin li{list-style:none;display:grid;grid-template-columns:52px 1fr;gap:18px;padding:18px 0;border-bottom:1px solid var(--line);font-size:clamp(17px,2vw,21px);letter-spacing:-.01em}
.prin li::before{counter-increment:pr;content:"0" counter(pr);font-family:var(--fm);font-size:11px;color:var(--volt);letter-spacing:.1em;padding-top:6px}
@media(max-width:860px){.ab-grid{grid-template-columns:1fr}}

/* 404 */
.nfbox{padding:8px 0 20px}
.nfbox p{color:var(--mut);max-width:50ch;margin:6px 0 28px}

/* ============ FOOTER ============ */
footer{border-top:1px solid var(--line);margin-top:clamp(80px,10vw,140px);padding:clamp(48px,7vw,90px) 0 34px}
.fw{font-weight:700;font-size:clamp(56px,14.5vw,168px);line-height:1;letter-spacing:-.045em;color:transparent;-webkit-text-stroke:1px var(--line2);display:inline-flex;align-items:baseline;transition:color .45s,-webkit-text-stroke-color .45s;cursor:default}
.fw svg{width:.55em;height:.78em;fill:none;stroke:var(--line2);stroke-width:1.4;transform:translateY(.03em);margin:0 .015em;transition:fill .45s,stroke .45s}
.fw:hover{color:var(--volt);-webkit-text-stroke-color:var(--volt)}
.fw:hover svg{fill:var(--volt);stroke:var(--volt)}
.frow{display:flex;flex-wrap:wrap;gap:12px 30px;justify-content:space-between;font-family:var(--fm);font-size:9px;letter-spacing:.15em;color:var(--dim);text-transform:uppercase;margin-top:36px;align-items:baseline}
.frow .sig{font-size:10px;color:#4E4E4A;letter-spacing:.12em}
.frow a{color:var(--mut)}
.frow a:hover{color:var(--volt)}

/* ============ ROUTE TRANSITION ============ */
#view{transition:opacity .18s ease,transform .18s ease;min-height:72vh;outline:none}
#view.out{opacity:0;transform:translateY(10px)}

function ago(iso){
  const s = (Date.now() - new Date(iso).getTime()) / 1e3;
  if (s < 90) return 'just now';
  const m = s/60, h = m/60, d = h/24;
  if (d < 1)  return Math.max(1,Math.floor(h)) + 'h ago';
  if (d < 30) return Math.floor(d) + 'd ago';
  if (d < 365) return Math.max(1,Math.floor(d/30)) + 'mo ago';
  return Math.floor(d/365) + 'y ago';
}
const fmtN = n => n >= 1000 ? (n/1000).toFixed(n >= 10000 ? 0 : 1).replace(/\.0$/,'') + 'k' : String(n||0);
const moYr = iso => new Date(iso).toLocaleString('en',{month:'short',year:'numeric'}).toUpperCase();
const szF = kb => kb >= 1024 ? (kb/1024).toFixed(1) + ' MB' : kb + ' KB';
const lc = l => LANGC[l] || '#6F6F69';
const langDot = l => l ? '<span class="lg"><i style="background:'+lc(l)+'"></i>'+esc(l)+'</span>' : '';
function meter(frac, segs){
  segs = segs || 28;
  const fill = Math.round(Math.max(0,Math.min(1,frac)) * segs);
  let h = '';
  for (let i = 0; i < segs; i++) h += '<i class="'+(i < fill ? 'f':'')+'" style="--s:'+i+'"></i>';
  return '<span class="met" aria-hidden="true">'+h+'</span>';
}

function readCache(){
  try {
    const c = JSON.parse(sessionStorage.getItem(CK));
    if (c && c.user && c.repos && Date.now() - c.t < 18e5) return c;
  } catch(e){}
  return null;
}
async function jget(url, sig){
  const r = await fetch(url, { headers:{ 'Accept':'application/vnd.github+json' }, signal:sig });
  if (!r.ok) { const e = new Error('HTTP ' + r.status); e.status = r.status; throw e; }
  return r.json();
}
function derive(user, repos){
  GH.user = user;
  GH.repos = repos;
  const list = repos
    .filter(r => CONFIG.includeForks || !r.fork)
    .filter(r => !CONFIG.hide.includes(r.name));
  const days = r => (Date.now() - new Date(r.pushed_at)) / 864e5;
  const score = r =>
    (r.stargazers_count || 0) * 4 +
    (r.homepage ? 4 : 0) + (r.description ? 2 : 0) +
    Math.min((r.topics || []).length, 4) +
    (days(r) < 30 ? 3 : 0) +
    (CONFIG.pin.includes(r.name) ? 100 : 0) -
    (r.archived ? 4 : 0);
  GH.visible = list.slice().sort((a,b) => new Date(b.pushed_at) - new Date(a.pushed_at));
  GH.featured = list.slice().sort((a,b) => score(b) - score(a)).slice(0, Math.min(4, list.length));
  const cnt = {};
  list.forEach(r => { if (r.language) cnt[r.language] = (cnt[r.language] || 0) + 1; });
  GH.langs = Object.keys(cnt).map(k => ({ name:k, n:cnt[k] })).sort((a,b) => b.n - a.n);
  GH.stars = list.reduce((s,r) => s + (r.stargazers_count || 0), 0);
  GH.top = GH.langs.length ? GH.langs[0].name : '';
  GH.recent = GH.visible.slice(0, 5);
  GH.ready = 'ok';
}
function apply(u, rs){ derive(u, rs); try { sessionStorage.setItem(CK, JSON.stringify({ t:Date.now(), user:u, repos:rs })); } catch(e){} notify(); }
let inflight = null;
function loadGH(force){
  if (inflight) return inflight;
  inflight = (async () => {
    try {
      if (!force) { const c = readCache(); if (c) { derive(c.user, c.repos); notify(); return; } }
      ldtext('LOADING PROFILE');
      const ctl = new AbortController();
      const kill = setTimeout(() => ctl.abort(), 9000);
      const [u, rs] = await Promise.all([
        jget(API + '/users/' + GH_USER, ctl.signal),
        jget(API + '/users/' + GH_USER + '/repos?per_page=100&sort=updated', ctl.signal)
      ]);
      clearTimeout(kill);
      ldtext('ALMOST THERE');
      apply(u, rs);
    } catch (e) {
      GH.error = (e && e.status === 403) ? 'GitHub API rate limit reached. Give it a few minutes, then retry.'
               : (e && e.name === 'AbortError') ? 'The GitHub API took too long to answer. Retry when the connection is better.'
               : 'Could not reach the GitHub API. Check the connection and retry.';
      GH.ready = 'error';
      notify();
    } finally { inflight = null; }
  })();
  return inflight;
}

const extraCache = new Map();
async function repoExtras(full){
  if (extraCache.has(full)) return extraCache.get(full);
  const p = (async () => {
    const out = { langs:null, commits:null };
    try { out.langs = await jget(API + '/repos/' + full + '/languages'); } catch(e){}
    try {
      const r = await fetch(API + '/repos/' + full + '/commits?per_page=1', { headers:{ 'Accept':'application/vnd.github+json' } });
      if (r.ok) {
        const link = r.headers.get('Link');
        const m = link && link.match(/[?&]page=(\d+)>;\s*rel="last"/);
        out.commits = m ? parseInt(m[1], 10) : (await r.json()).length;
      }
    } catch(e){}
    return out;
  })();
  extraCache.set(full, p);
  return p;
}

let cleanups = [];
function parseRoute(){
  const h = location.hash;
  if (!h || h === '#' || h.indexOf('#/') !== 0) return { key:'home' };
  const raw = h.slice(2);
  const [path, qs] = raw.split('?');
  const seg = path.split('/').filter(Boolean);
  const q = {};
  if (qs) new URLSearchParams(qs).forEach((v,k) => q[k] = v);
  if (seg[0] === 'projects') return seg[1] ? { key:'detail', arg:decodeURIComponent(seg[1]) } : { key:'projects', q };
  if (seg[0] === 'about' || seg[0] === 'contact') return { key:seg[0] };
  if (!seg[0]) return { key:'home' };
  return { key:'nf' };
}
let firstRoute = true;

  cleanups.forEach(f => { try { f(); } catch(e){} });

const io = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); }

/* ============ HERO FX (canvas arcs) ============ */
function initHeroFX(view){
  if (RM) return;
  const cv = view.querySelector('#arc'), hero = view.querySelector('.hero');
  if (!cv || !hero) return;
  const ctx = cv.getContext('2d');
  let W = 0, H = 0, on = true, arcs = [], raf = 0, lastMove = 0;
  const resize = () => {
    const dpr = Math.min(devicePixelRatio || 1, 2);
    W = hero.clientWidth; H = hero.clientHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  window.addEventListener('resize', resize);
  const vio = new IntersectionObserver(es => { on = es[0].isIntersecting; if (on) schedule(); });
  vio.observe(hero);
  function spawn(x, y, len, ang){
    const segs = 6 + (Math.random() * 4 | 0), pts = [[x, y]];
    let a = ang;
    for (let i = 0; i < segs; i++) {
      a += (Math.random() - .5) * .95;
      const st = len / segs;
      x += Math.cos(a) * st; y += Math.sin(a) * st;
      pts.push([x, y]);
    }
    arcs.push({ pts, t:0, life:.3 + Math.random() * .18 });
    if (!raf) raf = requestAnimationFrame(tick);
  }
  function tick(){
    ctx.clearRect(0, 0, W, H);
    arcs = arcs.filter(a => a.t < a.life);
    arcs.forEach(a => {
      a.t += .016;
      const al = Math.max(0, 1 - a.t / a.life);
      ctx.lineJoin = 'round';
      ctx.beginPath();
      a.pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
      ctx.strokeStyle = 'rgba(245,224,3,' + (.16 * al).toFixed(3) + ')';
      ctx.lineWidth = 2.6; ctx.stroke();
      ctx.strokeStyle = 'rgba(245,224,3,' + (.92 * al).toFixed(3) + ')';
      ctx.lineWidth = 1; ctx.stroke();
    });
    raf = arcs.length ? requestAnimationFrame(tick) : 0;
  }
  let idle = 0;
  function schedule(){
    clearTimeout(idle);
    idle = setTimeout(() => {
      if (on && !document.hidden) spawn(40 + Math.random() * (W - 80), H * .3 + Math.random() * H * .35, 60 + Math.random() * 90, Math.random() * Math.PI * 2);
      if (on) schedule();
    }, 1800 + Math.random() * 2400);
  }
  schedule();
  hero.addEventListener('pointermove', e => {
    const now = performance.now();
    if (now - lastMove < 90 || Math.random() > .4) return;
    lastMove = now;
    const r = hero.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    const sx = x - 30 - Math.random() * 60, sy = y + (Math.random() - .5) * 50;
    spawn(sx, sy, 40 + Math.random() * 55, Math.atan2(y - sy, x - sx));
  });
  cleanups.push(() => { vio.disconnect(); clearTimeout(idle); cancelAnimationFrame(raf); });
}

/* ============ VOLT GAUGE ============ */
(function initGauge(){
  const ticks = $('#gticks'), gv = $('#gv'), g = $('#gauge');
  for (let i = 0; i < 12; i++) ticks.appendChild(document.createElement('i'));
  const segs = [...ticks.children];
  let ticking = false;
  function upd(){
    ticking = false;
    const max = document.documentElement.scrollHeight - innerHeight;
    const p = max > 0 ? Math.min(1, scrollY / max) : 1;
    const n = Math.round(p * 12);
    segs.forEach((s, i) => s.classList.toggle('f', i < n));
    g.classList.toggle('full', p >= .995);
    gv.textContent = p >= .995 ? 'FULL' : Math.round(p * 100) + '%';
  }
  addEventListener('scroll', () => { if (!ticking) { ticking = true; requestAnimationFrame(upd); } }, { passive:true });
  addEventListener('resize', upd);
  upd();
})();

/* ============ MENU ============ */
const burger = $('#burger'), menu = $('#menu');
function openMenu(){
  menu.classList.add('open'); menu.setAttribute('aria-hidden','false');
  burger.setAttribute('aria-expanded','true'); burger.setAttribute('aria-label','Close menu');
  document.documentElement.classList.add('lock');
  const f = menu.querySelector('a'); if (f) f.focus();
}
function closeMenu(){
  menu.classList.remove('open'); menu.setAttribute('aria-hidden','true');
  burger.setAttribute('aria-expanded','false'); burger.setAttribute('aria-label','Open menu');
  document.documentElement.classList.remove('lock');
}
burger.addEventListener('click', () => menu.classList.contains('open') ? closeMenu() : openMenu());
addEventListener('keydown', e => { if (e.key === 'Escape' && menu.classList.contains('open')) { closeMenu(); burger.focus(); } });

$('#yr').textContent = new Date().getFullYear();

});
function ldtext(t){ const el = $('#ldtxt'); if (el) el.textContent = t; }
const ldStart = Date.now();
function hideLoader(){
  const wait = Math.max(0, 650 - (Date.now() - ldStart));
  setTimeout(() => { $('#ld').classList.add('off'); $('#hw') && $('#hw').classList.add('go'); }, wait);
}
Promise.race([loadGH().catch(() => {}), new Promise(res => setTimeout(res, 4500))]).then(hideLoader);
setTimeout(() => { if (GH.ready === '') { GH.ready = 'error'; GH.error = 'The GitHub API is slow to answer. The page still works; retry the sections that matter.'; notify(); } }, 5200);
addEventListener('hashchange', () => render(false));
render(true);

<script id="enh-js">
(function(){
'use strict';
/* 0 (registered at the bottom) · FIX: on a first visit (no cache) the page stayed on "connecting to the feed" forever,
   because nothing was subscribed to re-render once the GitHub data arrived */
/* 1 · FIX: clicking a language row set ?f=… but the Projects page never read it */
const origProjects = PAGES.projects.html;
PAGES.projects.html = function(r){
  const f = r && r.q && r.q.f;
  if (f) { fLang = f; fq = ''; } else if (r && r.q && !f && location.hash === '#/projects') { fLang = 'ALL'; }
  return withErr(origProjects(r));
};

/* 2 · FIX: projects + detail pages spun forever when the GitHub feed failed */
function withErr(html){
  return GH.ready === 'error'
    ? html.replace(/<div class="dstat"[^>]*>[\s\S]*?<\/div>/, derrBox())
    : html;
}
const origDetail = PAGES.detail.html;
PAGES.detail.html = a => withErr(origDetail(a));

/* 3 · FIX: retry now re-renders the current page once data lands */
document.addEventListener('click', e => {
  if (e.target.closest('[data-retry]')) subs.add(() => render(true));
});

/* 4 · FIX: hero title stayed hidden when navigating back to Home */
const origHomeAfter = PAGES.home.after;
PAGES.home.after = function(root, r){
  origHomeAfter(root, r);
  (function(){ const el = root.querySelector('#rot'); if (!el || RM) return;
    const w = ['Software developer','Founder','Python first','I build · I ship']; let i = 0;
    const id = setInterval(() => { el.classList.add('sw'); setTimeout(() => { i = (i+1) % w.length; el.textContent = w[i]; el.classList.remove('sw'); }, 300); }, 2600);
    cleanups.push(() => clearInterval(id)); })();
  const hw = root.querySelector('#hw');
  if (hw) requestAnimationFrame(() => requestAnimationFrame(() => hw.classList.add('go')));
};

/* 5 · UI: decorate filter chips with icons, keep active chip in view on mobile */
const view = document.getElementById('view');
function decorate(){
  view.querySelectorAll('.chip:not([data-dec])').forEach(c => {
    c.dataset.dec = 1;
    const n = c.dataset.chip;
    c.insertAdjacentHTML('afterbegin', n === 'ALL' ? I.bolt : '<i class="cdot" style="background:' + (LANGC[n] || '#6F6F69') + '"></i>');
  });
  const pq = view.querySelector('#pq'); if (pq && matchMedia('(max-width:720px)').matches) pq.placeholder = 'search';
  const on = view.querySelector('.chip.on');
  if (on && on.parentElement && on.parentElement.scrollWidth > on.parentElement.clientWidth)
    on.scrollIntoView({ inline:'center', block:'nearest', behavior:'auto' });
}
new MutationObserver(decorate).observe(view, { childList:true, subtree:true });
view.addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) c.scrollIntoView({ inline:'center', block:'nearest', behavior: RM ? 'auto' : 'smooth' });
});

/* 6 · UX: pointer spotlight on project rows */
view.addEventListener('pointermove', e => {
  const p = e.target.closest && e.target.closest('.proj');
  if (!p) return;
  const b = p.getBoundingClientRect();
  p.style.setProperty('--mx', (e.clientX - b.left) + 'px');
  p.style.setProperty('--my', (e.clientY - b.top) + 'px');
}, { passive:true });

/* 7 · UX: back-to-top with bolt icon */
const t = document.getElementById('totop');
t.hidden = false; t.innerHTML = I.ar;
t.addEventListener('click', () => scrollTo({ top:0, behavior: RM ? 'auto' : 'smooth' }));
let tk = false;
addEventListener('scroll', () => {
  if (tk) return; tk = true;
  requestAnimationFrame(() => { t.classList.toggle('show', scrollY > 700); tk = false; });
}, { passive:true });

/* 8 · UX: press "/" on the project index to jump to search */
addEventListener('keydown', e => {
  const q = document.getElementById('pq');
  if (e.key === '/' && q && !/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

/* re-render the current route so fixes 1, 2, 4 apply to the page already on screen */
render(true);
if (GH.ready === '') subs.add(() => render(true)); /* 0 · must come AFTER render(), which clears subs */
decorate();
})();
